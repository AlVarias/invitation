<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allen & Marry - Wedding Configurator</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #FDFCF8; color: #2A3B2E; max-width: 900px; margin: 0 auto; padding: 2rem; }
        .card { background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #EAD5D5; margin-bottom: 2rem; }
        .form-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media (min-width: 768px) { .form-grid { grid-template-columns: 1fr 1fr; } }
        .full-width { grid-column: 1 / -1; }
        .form-group { margin-bottom: 0; }
        label { display: block; font-size: 0.875rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.1em; color: #93A897; margin-bottom: 0.5rem; }
        input[type="text"], input[type="date"], input[type="url"], input[type="file"], textarea { width: 100%; padding: 0.75rem; border: 1px solid #E8ECE6; border-radius: 0.5rem; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        .note { font-size: 0.8rem; color: #6B7B6D; margin-top: 0.25rem; }
        h1 { font-family: serif; font-size: 2.5rem; text-align: center; margin-bottom: 2rem; }
        h2 { font-family: serif; font-size: 1.5rem; color: #D4A5A5; margin-top: 0; margin-bottom: 1.5rem; border-bottom: 1px solid #E8ECE6; padding-bottom: 0.5rem; }
        button { background: #D4A5A5; color: white; border: none; padding: 1rem 2rem; font-size: 1.125rem; text-transform: uppercase; letter-spacing: 0.1em; border-radius: 0.5rem; cursor: pointer; width: 100%; transition: background 0.3s; font-weight: bold; margin-bottom: 4rem; }
        button:hover { background: #C28D8D; }
    </style>
</head>
<body>

    <h1>Invitation Configurator</h1>

    <form id="configForm">
        <!-- Basic Information & Media -->
        <div class="card">
            <h2>Basic Details & Media</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Groom's Name</label>
                    <input type="text" id="groomName" value="Allen" required>
                </div>
                <div class="form-group">
                    <label>Bride's Name</label>
                    <input type="text" id="brideName" value="Marry" required>
                </div>
                <div class="form-group">
                    <label>Wedding Date</label>
                    <input type="date" id="weddingDate" value="2026-09-08" required>
                </div>
                <div class="form-group">
                    <label>Official Hashtag</label>
                    <input type="text" id="hashtag" value="#MarryHaveAllenIt" required>
                </div>
                <div class="form-group full-width">
                    <label>Spotify Playlist URL</label>
                    <input type="text" id="spotifyUrl" value='https://open.spotify.com/embed/playlist/6LZjtnX3f190Nnfts35DbM?utm_source=generator&si=31b0bde0108a4441' required>
                    <p class="note">Go to Spotify -> Share -> Embed playlist -> Copy the "src" URL between the quotes.</p>
                </div>
            </div>
        </div>

        <!-- Locations -->
        <div class="card">
            <h2>The Venue</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Venue Name</label>
                    <input type="text" id="venueName" value="The Stable Cottage" required>
                </div>
                <div class="form-group">
                    <label>Venue Region</label>
                    <input type="text" id="venueRegion" value="North West Auckland" required>
                </div>
                <div class="form-group full-width">
                    <label>Exact Address</label>
                    <input type="text" id="venueAddress" value="720 Peak Road, Helensville" required>
                </div>
                <div class="form-group full-width">
                    <label>Google Maps Embed URL</label>
                    <input type="text" id="mapUrl" value='https://www.google.com/maps/embed?pb=!3m2!1sen!2snz!4v1788342948558!5m2!1sen!2snz!6m8!1m7!1sWIFkBaE6nwyG10RKQSE5mQ!2m2!1d-36.68089580634993!2d174.5099508613131!3f285.1440468418404!4f-0.6514328407149321!5f0.7820865974627469' required>
                </div>
            </div>
        </div>

        <!-- Our Story -->
        <div class="card">
            <h2>Our Story</h2>
            <div class="form-grid">
                <!-- Story 1 -->
                <div class="form-group">
                    <label>Story 1: Date</label>
                    <input type="text" id="story1Date" value="February 2020" required>
                </div>
                <div class="form-group">
                    <label>Story 1: Title</label>
                    <input type="text" id="story1Title" value="The First Chat" required>
                </div>
                <div class="form-group full-width">
                    <label>Story 1: Details</label>
                    <textarea id="story1Text" required>We started talking online and getting to know each other.</textarea>
                </div>
                <div class="form-group full-width">
                    <label style="color:#D4A5A5;">Upload Photo for 'The First Chat'</label>
                    <input type="file" id="gallery1" accept="image/*">
                </div>

                <!-- Story 2 -->
                <div class="form-group mt-4">
                    <label>Story 2: Date</label>
                    <input type="text" id="story2Date" value="July 2020" required>
                </div>
                <div class="form-group mt-4">
                    <label>Story 2: Title</label>
                    <input type="text" id="story2Title" value="The First Meeting" required>
                </div>
                <div class="form-group full-width">
                    <label>Story 2: Details</label>
                    <textarea id="story2Text" required>We finally met in person with her family. It was during COVID times and she needed a ride back home too.</textarea>
                </div>
                <div class="form-group full-width">
                    <label style="color:#D4A5A5;">Upload Photo for 'The First Meeting'</label>
                    <input type="file" id="gallery2" accept="image/*">
                </div>

                <!-- Story 3 -->
                <div class="form-group mt-4">
                    <label>Story 3: Date</label>
                    <input type="text" id="story3Date" value="April 2026" required>
                </div>
                <div class="form-group mt-4">
                    <label>Story 3: Title</label>
                    <input type="text" id="story3Title" value="The Proposal" required>
                </div>
                <div class="form-group full-width">
                    <label>Story 3: Details</label>
                    <textarea id="story3Text" required>Allen finally popped the question on Lake Tekapo.</textarea>
                </div>
                <div class="form-group full-width">
                    <label style="color:#D4A5A5;">Upload Photo for 'The Proposal'</label>
                    <input type="file" id="gallery3" accept="image/*">
                </div>
            </div>
        </div>

        <!-- Base Image Uploads -->
        <div class="card">
            <h2>Website Photos</h2>
            <p class="note mb-4" style="margin-bottom: 1.5rem;">Upload the main background image for the top of the website.</p>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Hero Background Image</label>
                    <input type="file" id="heroImage" accept="image/*">
                </div>
            </div>
        </div>

        <button type="submit">Generate config.json</button>
    </form>

    <script>
        const imageBase64 = {
            heroImage: "https://images.unsplash.com/photo-1519225421980-715cb02151ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80",
            gallery1: "https://images.unsplash.com/photo-1606800052052-a08af7148866?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            gallery2: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80",
            gallery3: "https://images.unsplash.com/photo-1520854221256-17451cc331bf?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
        };

        function handleFile(event, key) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageBase64[key] = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        ['heroImage', 'gallery1', 'gallery2', 'gallery3'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('change', (e) => handleFile(e, id));
        });

        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const config = {
                names: {
                    groom: document.getElementById('groomName').value,
                    bride: document.getElementById('brideName').value
                },
                date: document.getElementById('weddingDate').value,
                hashtag: document.getElementById('hashtag').value,
                spotifyUrl: document.getElementById('spotifyUrl').value,
                location: {
                    venue: document.getElementById('venueName').value,
                    region: document.getElementById('venueRegion').value,
                    address: document.getElementById('venueAddress').value,
                    mapUrl: document.getElementById('mapUrl').value
                },
                story: [
                    {
                        date: document.getElementById('story1Date').value,
                        title: document.getElementById('story1Title').value,
                        text: document.getElementById('story1Text').value
                    },
                    {
                        date: document.getElementById('story2Date').value,
                        title: document.getElementById('story2Title').value,
                        text: document.getElementById('story2Text').value
                    },
                    {
                        date: document.getElementById('story3Date').value,
                        title: document.getElementById('story3Title').value,
                        text: document.getElementById('story3Text').value
                    }
                ],
                images: {
                    hero: imageBase64.heroImage,
                    gallery: [
                        imageBase64.gallery1,
                        imageBase64.gallery2,
                        imageBase64.gallery3
                    ]
                }
            };

            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(config, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "config.json");
            document.body.appendChild(downloadAnchorNode); 
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        });
    </script>
</body>
</html>
